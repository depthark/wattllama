<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>WattLlama</title>
  <defs>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="0.55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#07090c"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <!-- a lightning bolt that is a llama: ears and snout on top, the neck is the first
       stroke, the chest is the bolt's step, the strike ends in the point -->
