    L47 9  C47.5 6 50.5 6 51.5 9
    L57 23
    L61 8  C62 5 65 5.5 65.5 8.5
    L66 27
    C75 28 85 31 92 36
    C97 39 97 45 92 47
    C88 48.5 82 48 77 47
    L66 67
    L88 67
    L40 122
    L55 81
    L33 81
    Z"/>
  <circle cx="72" cy="35" r="3.4" fill="#07090c"/>
</svg>
