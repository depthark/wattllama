<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WattLlama social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: radial-gradient(900px 500px at 18% 45%, #0d2c2b 0%, #07090c 60%), #07090c;
    color: #e6e9ee; font-family: "Segoe UI", system-ui, sans-serif; position: relative;
  }
  .shot {
    position: absolute; right: -60px; top: 70px; width: 700px; border-radius: 14px;
    border: 1px solid #1f2630; box-shadow: 0 30px 80px #000c; transform: perspective(1400px) rotateY(-14deg) rotateX(4deg);
    opacity: .92;
  }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #07090c 38%, #07090ccc 52%, #07090c00 75%); }
  .left { position: absolute; left: 80px; top: 112px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 26px; }
  .brand img { width: 132px; height: 132px; filter: drop-shadow(0 0 30px #ffd23f40); }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -1.5px; }
  h1 span { color: #ffd23f; }
  .tag { font-size: 34px; font-weight: 600; margin-top: 34px; line-height: 1.25; }
  .tag b { color: #2ee6d6; font-weight: 700; }
  .sub { font-size: 22px; color: #8b95a3; margin-top: 18px; line-height: 1.4; }
  .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .chips span { border: 1px solid #2a323d; background: #0c0f13; border-radius: 999px; padding: 6px 16px; font-size: 19px; color: #c9d1db; }
  .chips span.y { border-color: #ffd23f66; color: #ffd23f; }
</style>
</head>
<body>
  <img class="shot" src="screenshot-dark.png" alt="">
  <div class="fade"></div>
  <div class="left">
    <div class="brand"><img src="logo.svg" alt=""><h1>Watt<span>Llama</span></h1></div>
    <div class="tag">How many watts does your <b>local LLM</b> really burn?</div>
    <div class="sub">Live power, temperature and energy-per-token dashboard<br>for Windows · llama.cpp · Ollama · LM Studio</div>
    <div class="chips"><span class="y">⚡ Wh / 1k tokens</span><span>no admin</span><span>no drivers</span><span>0 dependencies</span></div>
  </div>
</body>
</html>
