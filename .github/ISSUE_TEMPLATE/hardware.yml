name: Hardware report
description: Tell us how WattLlama measures on your PC (AMD / Intel GPUs, AMD CPUs, laptops, multi-GPU)
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: Every report helps, also "everything works". Compare with a smart plug or HWiNFO if you have one.
  - type: input
    id: gpu
    attributes: { label: GPU(s) }
    validations: { required: true }
  - type: input
    id: cpu
    attributes: { label: CPU }
    validations: { required: true }
  - type: dropdown
    id: lhm
    attributes:
      label: LibreHardwareMonitor running?
      options: ["no", "yes, version:"]
  - type: dropdown
    id: cpu_power
    attributes:
      label: CPU power on the page
      options: ["measured", "(est.)", "missing"]
  - type: textarea
    id: compare
    attributes: { label: How do the numbers compare, description: "GPU watts, CPU watts, temperatures vs another tool or a wall meter" }
  - type: textarea
    id: live
    attributes:
      label: Output of /api/live
      description: Open http://127.0.0.1:8091/api/live and paste it.
      render: json
